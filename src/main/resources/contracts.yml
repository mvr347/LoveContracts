# ============================================
# Пул контрактов. Суммы — в медных единицах (1 медная = 1; железная 100, золотая 2 000, алмазная 20 000).
# Можно писать и строкой: money: "2i 50c" (i = железная, g = золотая, d = алмазная, c = медная).
# 2026-10-03: пересчёт под новые номиналы LoveCore. Награда за контракт — «час работы» новичка:
#   лёгкие 150–400 (медные/железные), средние 500–900 (до 9 железных), тяжёлые 1 200–2 200
#   (золотая монета — редкая добавка за самые трудоёмкие). Штраф ≈ 35 % награды (на округление
#   до 50): провал должен ощущаться, но не обнулять заработок. Все суммы разом меняются в
#   config.yml: economy.reward-scale / economy.penalty-scale.
# ============================================

# Версия набора. Если на сервере лежит файл с меньшей версией, при старте он сохраняется как
# contracts.yml.bak-<время> и заменяется этим (иначе правки баланса из jar никогда не доходят до серверов).
