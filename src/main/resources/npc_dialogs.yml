# ============================================================
# 2026-11-27: Диалоги NPC. ПКМ по NPC из этого списка открывает окно с кнопками:
#   [ЗАДАНИЕ] ...   - только если активному поручению игрока нужен именно этот NPC (контрольная точка);
#   основное занятие NPC (магазин, мастерская...) или, у контрактщика, доска поручений;
#   «Сыграем во что-то»   - мини-игра LoveActivities против этого NPC (нужен LoveActivities);
#   «Как дела?»           - случайная реплика из small-talk, без повторов подряд;
#   «Закрыть».
# Поручения выдаёт только контрактщик (доска). Остальные NPC их не раздают: поручение лишь отправляет к ним по шагам.
# Shift+ПКМ по-прежнему открывает основное занятие NPC сразу, без окна.
#
# NPC без записи в этом файле ведут себя как раньше (окно не открывается).
# key: "@contractor", "@actor:<имя из npc-actors в config.yml>" или "@brew:<метка трактирщика>".
# main: board    - кнопка открывает доску поручений;
#       function - кнопка повторяет обычный клик, и NPC открывает своё занятие (магазин, гильдия и т.д.);
#       none     - кнопки основного занятия нет.
# game: GameType LoveActivities (BLACKJACK, DICE, RPS, GWENT, CARDS, CHESS) или пусто, если игры нет.
# Игра подобрана по характеру NPC: азартным NPC кости и карты, учёным и знати шахматы, гильдии гвинт.
# Реплики greetings показываются в окне при открытии, small-talk после «Как дела?».
# ============================================================
buttons:
  quest-prefix: "[ЗАДАНИЕ] "
  small-talk: "Как дела?"
  close: "Закрыть"
  game-default: "Сыграем во что-то"
  no-game-plugin: "Игры сейчас недоступны."

npcs:
  contractor:
    key: "@contractor"
    main: board
    main-label: "Просмотреть доску"
    game: CARDS
    game-label: "Сыграем в карты"
    greetings:
      - "Доска перед тобой. Что-нибудь приглянулось?"
      - "О, свежее лицо. Работа для тебя найдётся."
      - "Заказы сами себя не выполнят. Смотри доску."
      - "Хорошо, что зашёл: у меня как раз накопились поручения."
    small-talk:
      - "Дела идут: заказов больше, чем рук. Это приятная проблема."
      - "Как дела? Бумаги, печати, снова бумаги. Зато платят вовремя."
      - "Тихо. Слишком тихо для такого количества заказов."
      - "На прошлой неделе один герой вернул заказ с извинениями и мешком угля. Приятно, когда помнят."
      - "Говорят, кто берёт по одному поручению, живёт дольше. Я не спорю."
      - "Дела как дела. Лучше расскажи, что видел на дорогах."
      - "Если задание не по силам, лучше отказаться сразу. Я не обижусь. Почти."
      - "Налоги, пошлины, сборы... Хорошо хоть награды выдаю не я один."
  hunter:
    key: "@actor:hunter"
    main: function
    main-label: "Просмотреть доску"
    game: DICE
    game-label: "Сыграем в кости"
    greetings:
      - "След свежий, добыча близко. Чего тебе?"
      - "Тише, зверя спугнёшь. Ну, говори."
      - "Опять кто-то пропал в лесу, а может, просто заблудился."
      - "Присядь у костра, путник."
    small-talk:
      - "Дела? Волки наглеют, зайцы умнеют. Всё как обычно."
      - "Вчера по следу шёл до самого болота. Вернулся ни с чем, зато живой."
      - "Охота как карты: можно всё знать и всё равно остаться ни с чем."
      - "Пока ты тут стоишь, где-то уходит хороший кабан."
      - "Говорят, в чаще завёлся кто-то крупный. Я ставлю на медведя."
      - "Лук проверяю каждый вечер. Привычка, не суеверие."
      - "Дичи хватает, а вот честных охотников поменьше."
      - "Спокойно. Если что, я прикрою."
  herald:
    key: "@actor:herald"
    main: function
    main-label: "Узнать новости"
    game: RPS
    game-label: "Сыграем в камень-ножницы-бумагу"
    greetings:
      - "Слушайте, слушайте! А, это ты. Подходи."
      - "Новости свежие, слухи ещё свежее."
      - "Ты как раз вовремя: у меня есть что объявить."
      - "Глашатай к вашим услугам, добрый путник."
    small-talk:
      - "Дела? Кричу с утра до вечера, голос садится, а слава растёт."
      - "Объявлений больше, чем слушателей. Вот такая у нас публика."
      - "Главная новость дня: никто ничего не читает."
      - "Я знаю обо всём первым. Это и благословение, и проклятие."
      - "Сегодня на площади была ярмарка. Кого-то обсчитали, как всегда."
      - "Говорят, скоро объявят что-то грандиозное. Но это не точно."
      - "Хочешь секрет? Половина слухов выдумана. Вторая половина тоже."
      - "Без меня город бы молчал. А это скучно."
  guildmaster:
    key: "@actor:guildmaster"
    main: function
    main-label: "Дела гильдии"
    game: GWENT
    game-label: "Сыграем в гвинт"
    greetings:
      - "Гильдия всегда рада достойным."
      - "Слово и честь дороже золота. Чем могу помочь?"
      - "Вместе мы сильнее. Присоединишься?"
      - "У гильдии много дел и мало надёжных людей."
    small-talk:
      - "Дела? Кланы растут, споры множатся. Я успеваю за всем."
      - "Хорошая гильдия держится на доверии, а не на золоте."
      - "Новичков много, мастеров мало. Так всегда."
      - "Одиночка сильнее, чем кажется, но вместе мы сильнее вдвойне."
      - "Раздоры между кланами бывают громкими. Я предпочитаю слушать."
      - "Хороший союз начинается с честного слова."
      - "Знамя клана видно издалека. И враги видят его тоже."
      - "Как дела? Лучше, когда ты заходишь по делу."
  banker:
    key: "@actor:banker"
    main: function
    main-label: "Банковские услуги"
    game: BLACKJACK
    game-label: "Сыграем в блэкджек"
    greetings:
      - "Ваши сбережения в надёжных руках."
      - "Добро пожаловать. Деньги любят счёт."
      - "Что угодно клиенту: вклад, обмен или совет?"
      - "Монета к монете, и хватит на всё."
    small-talk:
      - "Дела? Курс стабилен, клиенты довольны, сундуки полны."
      - "Хороший банкир знает: удача приходит и уходит, а проценты остаются."
      - "Каждая монета должна работать. Лежать без дела ей незачем."
      - "На прошлой неделе кто-то принёс мешок медяков. Считали до вечера."
      - "Азарт хорош в меру. Я предпочитаю считать, а не рисковать."
      - "Не храните всё в одном сундуке: это совет бесплатный."
      - "Слухи о кризисе пока не подтверждаются. Хотя кто знает."
      - "Хочешь совет? Копи понемногу, трать с умом."
  commissioner:
    key: "@actor:commissioner"
    main: function
    main-label: "Комиссионная лавка"
    game: DICE
    game-label: "Сыграем в кости"
    greetings:
      - "У меня найдётся всё, а если нет, то будет."
      - "Заходи, посмотри. Дорого не возьму, обещаю."
      - "Чужое добро ищет нового хозяина."
      - "Лавка открыта, торг уместен."
    small-talk:
      - "Дела? Одни продают, другие покупают, а я посередине."
      - "Знаешь, что самое ценное в моей лавке? Репутация."
      - "Вчера принесли сундук, о котором забыл даже хозяин."
      - "Каждая вещь помнит прежних хозяев. Некоторые молчат, некоторые нет."
      - "Торговаться можно, но я не продаю себя в убыток."
      - "Редкие вещи появляются чаще, чем люди думают."
      - "Хорошая сделка, когда довольны обе стороны. Ну, или хотя бы одна."
      - "Приходи позже: может, привезут то, что тебе нужно."
  feudal:
    key: "@actor:feudal"
    main: function
    main-label: "Поговорить о землях"
    game: CHESS
    game-label: "Сыграем в шахматы"
    greetings:
      - "Земля принадлежит тем, кто её бережёт."
      - "Ты по делу о владениях?"
      - "Каждый клочок земли имеет хозяина."
      - "Говори, но помни: мой час дорог."
    small-talk:
      - "Дела? Земли обширны, хлопот не меньше."
      - "Налоги, споры о границах, жалобы соседей. Скучать не приходится."
      - "Хороший владелец знает каждый камень на своей земле."
      - "Раньше границы определяли мечом, теперь бумагой. Прогресс."
      - "Шахматы приучают к терпению. Правителю это нужнее всего."
      - "Не забывай платить аренду вовремя. Я напоминаю один раз."
      - "Кто строит добротно, тому и земля послушна."
      - "Приходи по делу, поговорим о приятном потом."
  craftsman:
    key: "@actor:craftsman"
    main: function
    main-label: "Мастерская"
    game: RPS
    game-label: "Сыграем в камень-ножницы-бумагу"
    greetings:
      - "Мастерская открыта. Что чиним, что куём?"
      - "Руки у меня заняты, зато уши свободны."
      - "Хорошая вещь служит долго, если о ней заботятся."
      - "Ну, что принёс на этот раз?"
    small-talk:
      - "Дела? Наковальня звенит, значит, жизнь идёт."
      - "Самое сложное в ремесле: объяснить заказчику, что чудес не бывает."
      - "Вчера чинил меч, который, по словам хозяина, был «почти новый». Ему лет сто."
      - "Хороший инструмент как друг: не подведёт, если не злоупотреблять."
      - "Огонь в горне не гашу. Привычка с детства."
      - "Знаешь, как отличить настоящую сталь? По звону."
      - "Якоря, ядра, знамёна. Работы хватает на всех."
      - "Присядь, отдохни. Железо подождёт."
  duelist:
    key: "@actor:duelist"
    main: function
    main-label: "Дуэли"
    game: CHESS
    game-label: "Сыграем в шахматы"
    greetings:
      - "Клинок наготове. Ты пришёл бросить вызов?"
      - "Честная дуэль украшает любого."
      - "Смотри в глаза, не на оружие."
      - "Хороший бой начинается с уважения."
    small-talk:
      - "Дела? Тренируюсь с рассвета, враги не дремлют."
      - "Дуэль решает спор лучше слов. Но слова дешевле."
      - "Побеждает не сильнейший, а тот, кто терпеливее."
      - "Шахматы похожи на дуэль: каждый ход может стать последним."
      - "Шрам на руке напоминает о скромности."
      - "Не бойся проиграть. Бойся не извлечь урок."
      - "Хочешь совет? Следи за ногами соперника, а не за клинком."
      - "Честь дороже победы. Хотя победа тоже приятна."
  innkeeper:
    key: "@brew:saloonkeeper_main"
    main: function
    main-label: "Выпить и закусить"
    game: CARDS
    game-label: "Сыграем в карты"
    greetings:
      - "Заходи, присаживайся. Кружку холодного?"
      - "У нас тепло, весело и бочки не пустеют."
      - "Давненько тебя не было. Что будешь?"
      - "Добро пожаловать в таверну."
    small-talk:
      - "Дела? Бочки полны, гости довольны, что ещё нужно?"
      - "Вчера двое поспорили, чей эль лучше. Выпили оба и помирились."
      - "Хороший напиток как хорошая история: дозреть должен."
      - "Странники приходят и уходят, а стойка остаётся."
      - "Слухи в таверне рождаются быстрее, чем пиво остывает."
      - "Говорят, умелому пивовару и золото не нужно. Врут, нужно."
      - "Карты, кости, байки у камина. Вот вечер, достойный человека."
      - "Если проголодался, пирог сегодня удался на славу."
