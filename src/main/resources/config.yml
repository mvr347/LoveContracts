# ============================================
# LoveContracts Конфигурация
# ============================================

plugin:
  enabled: true
  debug: false

# Ежедневная ротация
rotation:
  enabled: true
  time: "13:00"          # HH:mm по времени сервера (раз в день в 13:00)
  timezone: "UTC"
  daily-count: 20

  difficulty-distribution:
    easy: 60             # %
    medium: 30
    hard: 10

  notify-rotation: true
  rotation-announcement: "<green>✓ Появились новые контракты! Используйте /contracts</green>"

  warning-before-expiration-minutes: 5
  expiration-warning: "<yellow>⚠ Срок действия контрактов истекает через {TIME} мин.!</yellow>"

# Настройки наград
rewards:
  enabled: true
  money:
    enabled: true
  items:
    enabled: true
  reputation:
    enabled: false
    integration: "lovebehavior"

# Штрафы
penalties:
  enabled: true
  money:
    enabled: true
  reputation:
    enabled: false
  track-failures: true

