# ============================================
# LoveContracts Конфигурация
# ============================================

plugin:
  enabled: true
  debug: false

# Стиль игры (LoveBehavior). Добрые игроки (ступень 6, максимум) сосредоточены на
# сотрудничестве, а не на выполнении заказов за вознаграждение — контракты им недоступны.
# Ступени 0-5 (от агрессивного до почти доброго) принимать контракты могут.
playstyle:
  block-kind-from-accepting: true

# Ежедневная ротация
rotation:
  # 2026-11-22: отключена после перехода на единую систему поручений в npc_stories.yml;
  # пул ежедневных контрактов больше не обновляется (активные ранее контракты доигрываются по таймеру).
  enabled: false
  time: "13:00"          # HH:mm по времени сервера (раз в день в 13:00)
  timezone: "UTC"
  daily-count: 20

  difficulty-distribution:
    easy: 60             # %
    medium: 30
    hard: 10

  notify-rotation: true
  # 2026-09-29: текст объявления о смене контрактов теперь задаёт глашатай LoveTweaks
  # (herald.gui.messages.contracts-rotation-format в его config.yml) — в общий чат от этого
  # плагина ничего не пишется и команда /contracts не упоминается. notify-rotation по-прежнему
  # включает/выключает само объявление; старый ключ rotation-announcement больше не читается.
  rotation-sound: "BLOCK_BELL_USE"

  warning-before-expiration-minutes: 5
  expiration-warning: "<yellow>⚠ Срок действия контрактов истекает через {TIME} мин.!</yellow>"

# Экономика (2026-10-03: пересчёт под номиналы LoveCore 1 / 100 / 2 000 / 20 000).
# Все суммы плагина — в медных единицах; в конфигах можно писать и строкой "3i 50c"
# (c = медная, i = железная, g = золотая, d = алмазная).
stories:
  # 2026-11-22: отключена конвертация из contracts.yml — все поручения теперь описаны
  # напрямую в npc_stories.yml без автогенерации 3-шаговых шаблонов.
  convert-complex-orders: false

economy:
  contracts-v2:
    # Только награды/штрафы системных поручений; не затрагивает заказы игроков и LoveCore.
    reward-factor: 0.15
    max-reward: 240
    # 1 золотая = 2000 медных. За любые 24 часа можно заработать не более 1800.
    # Это скользящее окно, а не сбрасывающийся в полночь дневной лимит. 0 отключает лимит.
    rolling-income-limit: 1800
  # 2026-11-22: вариативная награда за скорость, вежливые диалоги и качество выполнения.
  # Потолок 1.5 удерживает суммарный бонус в пределах +50% к базе, чтобы даже при совпадении всех
  # трёх факторов награда не выходила за экономику сервера (240 * 1.5 = 360 при лимите 1800/24ч).
  reward-tiers:
    max-multiplier: 1.5
  # Множитель наград контрактов и NPC-квестов поверх значений из npc_stories.yml.
  # Почему отдельно: чтобы поднять или опустить все награды одним числом, не правя десятки записей.
  reward-scale: 1.0
  # То же для штрафов за провал.
  penalty-scale: 1.0
  # Применять ли общий индекс цен LoveCore (/lovecoreadmin economy index) к наградам и штрафам.
  # Выключайте, если хотите, чтобы инфляция сервера не двигала именно награды поручений.
  use-price-index: true
  # 2026-10-04: награды поручений с предметом в условии привязаны к модели цен LoveCore (economy v2).
  model-rewards:
    enabled: true
    work-factor: 0.5
    min-ratio: 0.5
    max-ratio: 3.0
  migration:
    # Во сколько раз пересчитать суммы в БД (штрафы, открытые заказы игроков, отложенные выплаты)
    # при каждом шаге economy.scale-version в LoveCore.
    factor: 5.0

# Настройки наград — все награды выдаются только физической валютой LoveCore
rewards:
  money:
    enabled: true

# Штрафы
penalties:
  enabled: false
  money:
    enabled: false
  reputation:
    enabled: false
  track-failures: true

