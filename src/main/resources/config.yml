# ============================================
# LoveContracts Configuration
# ============================================

plugin:
  enabled: true
  debug: false

# Daily rotation
rotation:
  enabled: true
  time: "00:00"          # HH:mm server time
  timezone: "UTC"
  daily-count: 20

  difficulty-distribution:
    easy: 60             # %
    medium: 30
    hard: 10

  notify-rotation: true
  rotation-announcement: "<green>✓ New contracts are available! Use /contracts</green>"

  warning-before-expiration-minutes: 5
  expiration-warning: "<yellow>⚠ Your contracts expire in {TIME} minutes!</yellow>"

# Rewards defaults
rewards:
  enabled: true
  money:
    enabled: true
    currency-symbol: "$"
  items:
    enabled: true
  reputation:
    enabled: false
    integration: "lovebehavior"

# Penalties
penalties:
  enabled: true
  money:
    enabled: true
  reputation:
    enabled: false
  track-failures: true

# GUI
gui:
  enabled: true
  title: "<gradient:#55FF55:#55FFFF>Contract Board</gradient>"
  auto-update: true
  update-interval-ms: 500

  difficulty-colors:
    easy: "green"
    medium: "yellow"
    hard: "red"

  materials:
    all: "COMPASS"
    accepted: "CHEST"
    completed: "EMERALD"
    failed: "REDSTONE"
    stats: "BOOK"

# NPC (Citizens)
npc:
  enabled: true
  info-update-interval: 10

# Signs
signs:
  enabled: true

# PlaceholderAPI
placeholders:
  enabled: true
  prefix: "lovecontracts"

# Database
database:
  # SQLite only for now
  file: "contracts.db"
  pool-size: 10
  connection-timeout: 30000
  leak-detection-threshold: 15000

# Player-to-player contracts (/pcontract) — separate from the daily NPC contract board above.
# Players hire each other: gold + items are escrowed via LoveCore's LoveEconomy on creation
# and paid out to the executor on completion (or refunded to the creator on cancel/expire).
player-contracts:
  enabled: true

  # Reputation gates (requires LoveCore + LoveBehavior; ignored if unavailable)
  min-reputation-to-create: 0
  min-reputation-to-accept: 0

  # Anti-spam limits
  max-open-per-creator: 3
  max-accepted-per-executor: 3
  allow-self-accept: false

  # Escrow bounds
  min-gold-reward: 10
  max-gold-reward: 100000
  # % of the gold reward burned as a gold sink on creation, on top of the escrowed reward
  creation-tax-percent: 5

  # Deadlines
  min-deadline-hours: 1
  max-deadline-hours: 168
  default-deadline-hours: 24

  # Refund the creator's escrow when a contract is cancelled / expires unclaimed
  refund-on-abandon: true
  refund-on-expire: true

  # How often (in minutes) to sweep for overdue contracts
  expiration-check-interval-minutes: 5

  board:
    title: "<gradient:#55FF55:#55FFFF>Player Contracts</gradient>"

# Logging
logging:
  enabled: true
  log-acceptances: true
  log-completions: true
  log-failures: true
  log-level: "INFO"
