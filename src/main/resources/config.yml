# NPC (Citizens)
npc:
  enabled: true
  info-update-interval: 10
  id: -1

  # "Живые" реакции на реальные вежливость/стиль игры (LoveBehavior). Срабатывает только при
  # ОТКРЫТИИ доски новых контрактов (нет активного контракта) — сдачу/отмену уже принятого
  # контракта эта секция не блокирует, игрок получает своё. Без LoveBehavior не действует.
  npc-dialogue:
    reject:
      enabled: true
      terrible-politeness:
        - "<red>Не люблю таких, как ты. Проваливай.</red>"
        - "<red>О тебе слишком много говорят плохого. Заказов не будет.</red>"
      aggressive-playstyle:
        - "<red>Спокойнее! Или у меня для тебя ничего нет.</red>"
        - "<red>Твой агрессивный настрой мне не нравится. Ступай своей дорогой.</red>"
    ambient:
      enabled: true
      chance: 0.35
      terrible-politeness:
        - "<gray>*смотрит на тебя с презрением*</gray>"
      aggressive-playstyle:
        - "<gray>*настороженно косится*</gray>"
      friendly:
        - "<green>О, рад тебя видеть!</green>"
        - "<green>С тобой всегда приятно иметь дело.</green>"

# Таблички
signs:
  enabled: true

# PlaceholderAPI
placeholders:
  enabled: true
  prefix: "lovecontracts"

# База данных
database:
  file: "contracts.db"
  pool-size: 10
  connection-timeout: 30000
  leak-detection-threshold: 15000

# Заказы между игроками (/pcontract)
player-contracts:
  enabled: true

  min-reputation-to-create: 0
  min-reputation-to-accept: 0

  max-open-per-creator: 3
  max-accepted-per-executor: 3
  allow-self-accept: false

  # Границы награды в заказе игрока. 2026-10-03: 10 → 100 (одна железная монета: меньше смысла
  # нет, налог создания 5 % округлился бы до нуля), 100 000 → 1 000 000 (50 золотых монет).
  # Число или строка: "1i", "50d".
  min-gold-reward: 100
  max-gold-reward: 1000000
  creation-tax-percent: 5

  # Корректировка налога на создание контракта по вежливости/стилю игры создателя
  # (LoveCore.BehaviorLevels, ставит LoveBehavior).
  behavior-tax-adjustment:
    enabled: true
    discount-percent: 0.10       # вежливым/добрым — скидка от creation-tax-percent
    surcharge-percent: 0.10      # токсичным — надбавка
    politeness-good-threshold: 5 # ступень вежливости 0-6
    politeness-bad-threshold: 1  # ступень вежливости 0-6 и ниже

  min-deadline-hours: 1
  max-deadline-hours: 168
  default-deadline-hours: 24

  refund-on-abandon: true
  refund-on-expire: true

  expiration-check-interval-minutes: 5

  board:
    title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

# Логирование
logging:
  enabled: true
  log-acceptances: true
  log-completions: true
  log-failures: true
  log-level: "INFO"
