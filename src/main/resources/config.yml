# ============================================
# LoveContracts Конфигурация
# ============================================

plugin:
  enabled: true
  debug: false

# Ежедневная ротация
rotation:
  enabled: true
  time: "00:00"          # HH:mm по времени сервера
  timezone: "UTC"
  daily-count: 20

  difficulty-distribution:
    easy: 60             # %
    medium: 30
    hard: 10

  notify-rotation: true
  rotation-announcement: "<green>✓ Появились новые контракты! Используйте /contracts</green>"

  warning-before-expiration-minutes: 5
  expiration-warning: "<yellow>⚠ Срок действия контрактов истекает через {TIME} мин.!</yellow>"

# Настройки наград
rewards:
  enabled: true
  money:
    enabled: true
  items:
    enabled: true
  reputation:
    enabled: false
    integration: "lovebehavior"

# Штрафы
penalties:
  enabled: true
  money:
    enabled: true
  reputation:
    enabled: false
  track-failures: true

# GUI
gui:
  enabled: true
  title: "<gradient:#55FF55:#55FFFF>Доска контрактов</gradient>"
  auto-update: true
  update-interval-ms: 500
  locked-head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzkxMzZlZTFjYzk5NDU3YTNjZjhhMmIzZWVjOWFiMzAyODlmNzg2ZWNpeDNhNWVjMjAyYWViNjZlYjEzNmFiIn19fQ=="

  difficulty-colors:
    easy: "green"
    medium: "yellow"
    hard: "red"

  materials:
    all: "COMPASS"
    accepted: "CHEST"
    completed: "EMERALD"
    failed: "REDSTONE"
    stats: "BOOK"

# NPC (Citizens)
npc:
  enabled: true
  info-update-interval: 10
  id: -1

# Таблички
signs:
  enabled: true

# PlaceholderAPI
placeholders:
  enabled: true
  prefix: "lovecontracts"

# База данных
database:
  file: "contracts.db"
  pool-size: 10
  connection-timeout: 30000
  leak-detection-threshold: 15000

# Заказы между игроками (/pcontract)
player-contracts:
  enabled: true

  min-reputation-to-create: 0
  min-reputation-to-accept: 0

  max-open-per-creator: 3
  max-accepted-per-executor: 3
  allow-self-accept: false

  min-gold-reward: 10
  max-gold-reward: 100000
  creation-tax-percent: 5

  min-deadline-hours: 1
  max-deadline-hours: 168
  default-deadline-hours: 24

  refund-on-abandon: true
  refund-on-expire: true

  expiration-check-interval-minutes: 5

  board:
    title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

# Логирование
logging:
  enabled: true
  log-acceptances: true
  log-completions: true
  log-failures: true
  log-level: "INFO"
