# 2026-11-21: секция integrations.npc-provider удалена. NPC доски и цепочек теперь поставляет только
# LoveEssential (Citizens и прочие провайдеры не поддерживаются): выбирать больше не из чего.

# NPC доски поручений
npc:
  enabled: true
  info-update-interval: 10
  key: ""

  # "Живые" реакции на реальные вежливость/стиль игры (LoveBehavior).
  npc-dialogue:
    reject:
      enabled: true
      terrible-politeness:
        - "<red>Не люблю таких, как ты. Проваливай.</red>"
        - "<red>О тебе слишком много говорят плохого. Заказов не будет.</red>"
      aggressive-playstyle:
        - "<red>Спокойнее! Или у меня для тебя ничего нет.</red>"
        - "<red>Твой агрессивный настрой мне не нравится. Ступай своей дорогой.</red>"
    ambient:
      enabled: true
      chance: 0.35
      terrible-politeness:
        - "<gray>*смотрит на тебя с презрением*</gray>"
      aggressive-playstyle:
        - "<gray>*настороженно косится*</gray>"
      friendly:
        - "<green>С тобой всегда приятно иметь дело.</green>"

# Таблички
signs:
  enabled: true

# PlaceholderAPI
placeholders:
  enabled: true
  prefix: "lovecontracts"

# База данных
database:
  file: "contracts.db"
  pool-size: 10
  connection-timeout: 30000
  leak-detection-threshold: 15000

# Заказы между игроками (/pcontract)
player-contracts:
  enabled: true
  # 2026-11-22: интерфейс и команды /pcontract временно скрыты по просьбе владельца,
  # фоновые возвраты эскроу и обработка уже открытых заказов в БД не затрагиваются.
  ui-enabled: false

  min-reputation-to-create: 0
  min-reputation-to-accept: 0

  max-open-per-creator: 3
  max-accepted-per-executor: 3
  allow-self-accept: false

  # Границы награды в заказе игрока (число или строка монет: "1i", "100d").
  # 2026-10-05: границы от 1 медной до 100 алмазных монет (2 000 000 меди) под крупные заказы.
  min-reward: 1
  max-reward: "100d"
  creation-tax-percent: 5

  # Корректировка налога на создание контракта по вежливости/стилю игры создателя
  behavior-tax-adjustment:
    enabled: true
    discount-percent: 0.10
    surcharge-percent: 0.10
    politeness-good-threshold: 5
    politeness-bad-threshold: 1

  min-deadline-hours: 1
  max-deadline-hours: 168
  default-deadline-hours: 24

  refund-on-abandon: true
  refund-on-expire: true

  expiration-check-interval-minutes: 5

  board:
    title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

# Логирование
logging:
  enabled: true
  log-acceptances: true
  log-completions: true
  log-failures: true
  log-level: "INFO"

# 2026-11-24: что происходит при ПКМ по NPC, у которого есть поручение для игрока.
# contract - сразу разговор по поручению (обычное занятие NPC доступно через Shift+ПКМ);
# choice - окно выбора «Поручение / Обычное занятие NPC». choice нужен там, где у NPC есть своя функция (магазин,
# кузнец), иначе игрок попадает к ней только присев. По умолчанию contract: поведение не меняется само.
quests:
  npc-click-mode: contract

  # 2026-11-24: сколько поручений игрок ведёт одновременно. 1: одно дело за раз на весь сервер (решение
  # владельца), каждое поручение остаётся осмысленным. Кто уже ведёт больше, оставляет их, но новых не берёт.
  max-active: 1
  # Заказы охотников (LoveHunt) считаются тем же делом: пока есть принятый заказ, поручение не берётся, и наоборот.
  one-assignment-at-a-time: true

# Временная замена обычного табло через ScoreboardService LE.
quest-scoreboard:
  enabled: true
  priority: 20

# 2026-11-22: постоянные NPC города для сюжетных поручений (ключи из LoveEssential).
npc-actors:
  innkeeper:
    npc-key: "ext-3ade3b32"
  craftsman:
    npc-key: "ext-16e5a977"
  hunter:
    npc-key: "ext-2417a6f6"
  herald:
    npc-key: "ext-9fc5a55d"
  guildmaster:
    npc-key: "ext-0f72a311"
  feudal:
    tag-key: "loveshops_feudal"
    tag-value: "true"
  banker:
    tag-key: "loveshops_type"
    tag-value: "banker"
  commissioner:
    tag-key: "loveshops_type"
    tag-value: "commissioner"
  duelist:
    npc-key: "323"
