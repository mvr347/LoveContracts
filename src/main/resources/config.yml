  materials:
    all: "COMPASS"
    accepted: "CHEST"
    completed: "EMERALD"
    failed: "REDSTONE"
    stats: "BOOK"

# NPC (Citizens)
npc:
  enabled: true
  info-update-interval: 10
  id: -1

# Таблички
signs:
  enabled: true

# PlaceholderAPI
placeholders:
  enabled: true
  prefix: "lovecontracts"

# База данных
database:
  file: "contracts.db"
  pool-size: 10
  connection-timeout: 30000
  leak-detection-threshold: 15000

# Заказы между игроками (/pcontract)
player-contracts:
  enabled: true

  min-reputation-to-create: 0
  min-reputation-to-accept: 0

  max-open-per-creator: 3
  max-accepted-per-executor: 3
  allow-self-accept: false

  min-gold-reward: 10
  max-gold-reward: 100000
  creation-tax-percent: 5

  min-deadline-hours: 1
  max-deadline-hours: 168
  default-deadline-hours: 24

  refund-on-abandon: true
  refund-on-expire: true

  expiration-check-interval-minutes: 5

  board:
    title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

# Логирование
logging:
  enabled: true
  log-acceptances: true
  log-completions: true
  log-failures: true
  log-level: "INFO"
