# ============================================
# LoveContracts Конфигурация
# ============================================

plugin:
  enabled: true
  debug: false

# Стиль игры (LoveBehavior). Добрые игроки (ступень 6, максимум) сосредоточены на
# сотрудничестве, а не на выполнении заказов за вознаграждение — контракты им недоступны.
# Ступени 0-5 (от агрессивного до почти доброго) принимать контракты могут.
playstyle:
  block-kind-from-accepting: true

# Ежедневная ротация
rotation:
  enabled: true
  time: "13:00"          # HH:mm по времени сервера (раз в день в 13:00)
  timezone: "UTC"
  daily-count: 20

  difficulty-distribution:
    easy: 60             # %
    medium: 30
    hard: 10

  notify-rotation: true
  # 2026-09-29: текст объявления о смене контрактов теперь задаёт глашатай LoveTweaks
  # (herald.gui.messages.contracts-rotation-format в его config.yml) — в общий чат от этого
  # плагина ничего не пишется и команда /contracts не упоминается. notify-rotation по-прежнему
  # включает/выключает само объявление; старый ключ rotation-announcement больше не читается.
  rotation-sound: "BLOCK_BELL_USE"

  warning-before-expiration-minutes: 5
  expiration-warning: "<yellow>⚠ Срок действия контрактов истекает через {TIME} мин.!</yellow>"

# Экономика (2026-10-03: пересчёт под номиналы LoveCore 1 / 100 / 2 000 / 20 000).
# Все суммы плагина — в медных единицах; в конфигах можно писать и строкой "3i 50c"
# (c = медная, i = железная, g = золотая, d = алмазная).
economy:
  # Множитель наград контрактов и NPC-квестов поверх значений из contracts.yml / npc_quests.yml.
  # Почему отдельно: чтобы поднять или опустить все награды одним числом, не правя 40 контрактов.
  reward-scale: 1.0
  # То же для штрафов за провал. Штраф ≈ 35 % награды (см. шапку contracts.yml).
  penalty-scale: 1.0
  # Применять ли общий индекс цен LoveCore (/lovecoreadmin economy index) к наградам и штрафам.
  # Выключайте, если хотите, чтобы инфляция сервера не двигала именно награды контрактов.
  use-price-index: true
  # 2026-10-04: награды контрактов с предметом в условии (добыча/крафт) привязаны к модели цен LoveCore
  # (economy v2): модель × количество × work-factor / награда из contracts.yml. Причина: раньше суммы были
  # зашиты в yml и правки цен в LoveCore до контрактов не доходили. Множитель ограничен [min-ratio, max-ratio],
  # чтобы ошибочная цена в модели не сделала награду абсурдной; штраф меняется на тот же множитель.
  # work-factor 0.5 — платим вдвое меньше рыночной цены добычи (остальное — «зарплата» за гарантированный заказ).
  model-rewards:
    enabled: true
    work-factor: 0.5
    min-ratio: 0.5
    max-ratio: 3.0
  # Шаги суммы награды в меню создания контракта (клик по кругу). Числа или строки "1i".
  creation-reward-steps: [100, 500, 2000, 10000]
  migration:
    # Во сколько раз пересчитать суммы в БД (штрафы, открытые заказы игроков, отложенные выплаты)
    # при каждом шаге economy.scale-version в LoveCore. Почему 5: цена алмаза выросла с ~50 до 100,
    # типичные цены — в 3-8 раз, ×5 — середина; перед пересчётом делается копия contracts.db.pre-economy-v*.
    # Отклонения потом правятся индексом цен LoveCore.
    factor: 5.0

# Настройки наград — все награды выдаются только физической валютой LoveCore
rewards:
  money:
    enabled: true

# Штрафы
penalties:
  enabled: true
  money:
    enabled: true
  reputation:
    enabled: false
  track-failures: true

