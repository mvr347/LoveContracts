# ============================================
# 2026-11-22: Единый пул поручений (45 квестов: 20 лёгких, 15 средних, 10 сложных).
# Без Незера и Энда. Используются постоянные NPC сервера (@contractor, @brew:*, @actor:*).
# ============================================
data-version: 2

npc_quests:
  easy_bread:
    enabled: true
    npc-key: "@contractor"
    display-name: "<green>Свежий хлеб для дозора</green>"
    tier: EASY
    time-limit-minutes: 30
    summary: "Страже на воротах нужен свежий хлеб. Соберите 16 буханок и передайте контрактщику."
    repeatable: true
    cooldown-minutes: 720
    initial-dialogue: greeting
    dialogues:
      greeting:
        text:
          - "<yellow>Контрактщик:</yellow> Страже на воротах нужен свежий хлеб. Соберите 16 буханок и передайте контрактщику."
        options:
          - {text: "С радостью помогу вам!", action: ACCEPT_QUEST, bonus: true}
          - {text: "Возьму заказ", action: ACCEPT_QUEST}
          - {text: "Зайду позже", action: CLOSE}
    steps:
      - step: 1
        type: DELIVER_ITEM
        material: BREAD
        count: 16
        target-npc-key: "@contractor"
        target-npc-name: "Контрактщик"
        description: "Принесите 16x BREAD контрактщику"
        dialogue:
          text:
            - "<yellow>Контрактщик:</yellow> Принёс всё по списку?"
          options:
            - {text: "Вот всё в лучшем виде!", action: COMPLETE_STEP, bonus: true}
            - {text: "Передать заказ", action: COMPLETE_STEP}
            - {text: "Ещё собираю", action: CLOSE}
    rewards:
      money: 80

