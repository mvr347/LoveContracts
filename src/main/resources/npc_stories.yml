        target-npc-name: "Охотник"
        description: "Завершите дозор у охотника"
        dialogue:
          text:
            - "<yellow>Охотник:</yellow> Просека чиста до самого утра. Отличная вылазка."
          options:
            - {text: "Завершить", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
    rewards:
      money: 240

  hard_vault_audit:
    enabled: true
    npc-key: "@actor:banker"
    display-name: "<red>Ревизия хранилища</red>"
    tier: HARD
    time-limit-minutes: 195
    summary: "Счётовод обновляет печати и чернила. Пройдите проверку с комиссионером, добудьте лазурит и доложите феодалу."
    repeatable: true
    cooldown-minutes: 2880
    initial-dialogue: greeting
    dialogues:
      greeting:
        text:
          - "<yellow>Счётовод:</yellow> Раз в сезон мы сверяем казну и обновляем лазуритовые печати."
        options:
          - {text: "Гарантирую полную аккуратность и порядок!", action: ACCEPT_QUEST, bonus: true}
          - {text: "Помогу с ревизией", action: ACCEPT_QUEST}
          - {text: "Зайду позже", action: CLOSE}
    steps:
      - step: 1
        type: VISIT_NPC
        target-npc-key: "@actor:commissioner"
        target-npc-name: "Комиссионер"
        description: "Сверьте реестр товаров у комиссионера"
        dialogue:
          text:
            - "<yellow>Комиссионер:</yellow> Все накладные сходятся. Осталось добыть 16 лазуритовой руды."
          options:
            - {text: "Сверка окончена", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 2
        type: MINE_MATERIAL
        material: LAPIS_ORE
        count: 16
        description: "Добудьте 16 лазуритовой руды"
      - step: 3
        type: DELIVER_ITEM
        material: LAPIS_LAZULI
        count: 16
        target-npc-key: "@actor:craftsman"
        target-npc-name: "Ремесленник"
        description: "Отнесите 16 лазурита ремесленнику для печатей"
        dialogue:
          text:
            - "<yellow>Ремесленник:</yellow> Краситель готов, штемпель вырезан! Неси феодалу на подпись."
          options:
            - {text: "Вот отборный камень для новых печатей!", action: COMPLETE_STEP, bonus: true}
            - {text: "Передать лазурит", action: COMPLETE_STEP}
            - {text: "Ещё собираю", action: CLOSE}
      - step: 4
        type: VISIT_NPC
        target-npc-key: "@actor:feudal"
        target-npc-name: "Феодал"
        description: "Подпишите акт ревизии у феодала"
        dialogue:
          text:
            - "<yellow>Феодал:</yellow> Подпись поставлена. Возвращайся к счётоводу."
          options:
            - {text: "Подписать акт", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 5
        type: VISIT_NPC
        target-npc-key: "@actor:herald"
        target-npc-name: "Глашатай"
        description: "Сообщите глашатаю о завершении ревизии"
        dialogue:
          text:
            - "<yellow>Глашатай:</yellow> Объявляю, что торги продолжаются в обычном режиме!"
          options:
            - {text: "Сообщить", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 6
        type: VISIT_NPC
        target-npc-key: "@actor:banker"
        target-npc-name: "Счётовод"
        description: "Сдайте итоговый отчёт счётоводу"
        dialogue:
          text:
            - "<yellow>Счётовод:</yellow> Баланс сошёлся до медной монеты. Спасибо за помощь!"
          options:
            - {text: "Завершить", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
    rewards:
      money: 235

  hard_grand_assembly:
    enabled: true
    npc-key: "@actor:guildmaster"
    display-name: "<red>Большой совет гильдий</red>"
    tier: HARD
    time-limit-minutes: 240
    summary: "Гильдмастер созывает все восемь ветвей власти на совет. Подготовьте торт, часы и обойдите всех участников."
    repeatable: true
    cooldown-minutes: 2880
    initial-dialogue: greeting
    dialogues:
      greeting:
        text:
          - "<yellow>Гильдмастер:</yellow> Наступает день Большого совета. Только самый надёжный посланник сможет собрать всех вовремя."
        options:
          - {text: "Обещаю, каждый гость будет вовремя и в лучшем настроении!", action: ACCEPT_QUEST, bonus: true}
          - {text: "Стану посланником совета", action: ACCEPT_QUEST}
          - {text: "Кого нужно обойти?", action: NEXT_NODE, next-node: details}
          - {text: "Зайду позже", action: CLOSE}
      details:
        text:
          - "Глашатая, трактирщика, феодала, дуэлянта, счётовода и комиссионера — и вернуться ко мне."
        options:
          - {text: "Стану посланником совета", action: ACCEPT_QUEST}
          - {text: "Пока не готов", action: CLOSE}
    steps:
      - step: 1
        type: VISIT_NPC
        target-npc-key: "@actor:herald"
        target-npc-name: "Глашатай"
        description: "Предупредите глашатая о созыве совета"
        dialogue:
          text:
            - "<yellow>Глашатай:</yellow> Вестники разосланы. Загляни в трактир за десертом."
          options:
            - {text: "К трактирщику", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 2
        type: VISIT_NPC
        target-npc-key: "@brew:saloonkeeper_main"
        target-npc-name: "Трактирщик"
        description: "Договоритесь с трактирщиком о сладком столе"
        dialogue:
          text:
            - "<yellow>Трактирщик:</yellow> Если принесёшь феодалу три праздничных торта, он будет в восторге!"
          options:
            - {text: "Приготовим торты", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 3
        type: DELIVER_ITEM
        material: CAKE
        count: 3
        target-npc-key: "@actor:feudal"
        target-npc-name: "Феодал"
        description: "Вручите 3 торта феодалу"
        dialogue:
          text:
            - "<yellow>Феодал:</yellow> Великолепно! Предупреди дуэлянта о почётном карауле."
          options:
            - {text: "Ваш любимый десерт к началу совета!", action: COMPLETE_STEP, bonus: true}
            - {text: "Подать торты", action: COMPLETE_STEP}
            - {text: "Ещё собираю", action: CLOSE}
      - step: 4
        type: VISIT_NPC
        target-npc-key: "@actor:duelist"
        target-npc-name: "Дуэлянт"
        description: "Вызовите караул у дуэлянта"
        dialogue:
          text:
            - "<yellow>Дуэлянт:</yellow> Караул выдвигается. Нам с комиссионером не хватает точных часов для регламента."
          options:
            - {text: "Сделаю часы", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 5
        type: CRAFT_ITEM
        material: CLOCK
        count: 2
        description: "Скрафтите 2 часов"
      - step: 6
        type: DELIVER_ITEM
        material: CLOCK
        count: 2
        target-npc-key: "@actor:banker"
        target-npc-name: "Счётовод"
        description: "Передайте 2 часов счётоводу"
        dialogue:
          text:
            - "<yellow>Счётовод:</yellow> Теперь речи регламентированы до секунды! Остался комиссионер."
          options:
            - {text: "Идут секунду в секунду!", action: COMPLETE_STEP, bonus: true}
            - {text: "Передать часы", action: COMPLETE_STEP}
            - {text: "Ещё собираю", action: CLOSE}
      - step: 7
        type: VISIT_NPC
        target-npc-key: "@actor:commissioner"
        target-npc-name: "Комиссионер"
        description: "Подтвердите кворум у комиссионера"
        dialogue:
          text:
            - "<yellow>Комиссионер:</yellow> Все делегаты на месте. Докладывай гильдмастеру!"
          options:
            - {text: "К гильдмастеру", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
      - step: 8
        type: VISIT_NPC
        target-npc-key: "@actor:guildmaster"
        target-npc-name: "Гильдмастер"
        description: "Откройте совет отчётом у гильдмастера"
        dialogue:
          text:
            - "<yellow>Гильдмастер:</yellow> Большой совет открыт вовремя! Это было безупречное поручение."
          options:
            - {text: "Завершить совет", action: COMPLETE_STEP}
            - {text: "Позже", action: CLOSE}
    rewards:
      money: 240
