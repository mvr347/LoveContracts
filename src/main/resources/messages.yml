  contract-status-click-to-accept: "<yellow>Нажмите, чтобы принять</yellow>"

  confirm-title: "<gradient:#55FF55:#55FFFF>Подтверждение контракта</gradient>"
  confirm-yes: "<green>✓ Принять контракт</green>"
  confirm-yes-lore: "<gray>Нажмите, чтобы подтвердить принятие</gray>"
  confirm-no: "<red>✗ Отмена</red>"
  confirm-no-lore: "<gray>Нажмите, чтобы вернуться на доску</gray>"

  player-board-title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

filters:
  all: "Все"
  easy: "Легкие"
  medium: "Средние"
  hard: "Сложные"
  available: "Доступные"
  accepted: "Взятые"
  completed: "Выполненные"
  failed: "Проваленные"

sorts:
  all: "Все"
  reward-high: "От Б до М"
  reward-low: "От М до Б"
  difficulty: "Сложность"

difficulties:
  starter: "Новичок"
  easy: "Легкий"
  medium: "Средний"
  hard: "Сложный"

messages:
  contract-accepted: "<green>Вы приняли контракт:</green> <gold>{CONTRACT}</gold>"
  contract-completed: "<green>Выполнено:</green> <gold>{CONTRACT}</gold>"
  contract-failed: "<red>Провал:</red> <gold>{CONTRACT}</gold>"
  contract-already-taken: "<red>Вы уже приняли этот контракт сегодня или свободные слоты закончились.</red>"
  contract-already-active: "<red>Вы уже выполняете контракт! Одновременно можно взять только один контракт.</red>"
  contract-not-met: "<red>Вы не соответствуете требованиям этого контракта!</red>"
  contract-not-found: "<red>Контракт не найден.</red>"
  contract-disabled: "<red>Для вас доступ к контрактам отключен администратором.</red>"
