  fine-collected: "<green>Списано {AMOUNT} монет в счет погашения долга по штрафу.</green>"
  fine-cleared: "<green>Поздравляем! Ваш долг по штрафам полностью погашен!</green>"

  broadcast-accept: "<yellow>{PLAYER}</yellow> принял(а) контракт <gold>{CONTRACT}</gold>"
  broadcast-complete: "<yellow>{PLAYER}</yellow> выполнил(а) контракт <gold>{CONTRACT}</gold>"
  broadcast-fail: "<yellow>{PLAYER}</yellow> провалил(а) контракт <gold>{CONTRACT}</gold>"
