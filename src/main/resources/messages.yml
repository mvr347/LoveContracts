# ============================================
# Сообщения LoveContracts (MiniMessage)
# ============================================

prefix: "<gradient:#55FF55:#55FFFF>[LoveContracts]</gradient> "

contract:
  accepted:
    self: "<green>Вы приняли контракт:</green> <gold>{CONTRACT}</gold>"
    broadcast: "<yellow>{PLAYER}</yellow> принял контракт <gold>{CONTRACT}</gold>"
    actionbar: "<gold>Контракт принят: {CONTRACT}</gold>"
  completed:
    self: "<green>Выполнено:</green> <gold>{CONTRACT}</gold> <gray>→</gray> <green>{REWARDS}</green>"
    broadcast: "<yellow>{PLAYER}</yellow> выполнил контракт <gold>{CONTRACT}</gold>"
    actionbar: "<green>✓ Выполнено! +{REWARDS}</green>"
  failed:
    self: "<red>Провалено:</red> <gold>{CONTRACT}</gold> {PENALTIES}"
    broadcast: "<yellow>{PLAYER}</yellow> провалил контракт <gold>{CONTRACT}</gold>"
    actionbar: "<red>✗ Провалено</red>"
  already-taken: "<red>Вы уже приняли этот контракт сегодня.</red>"
  not-available: "<red>Этот контракт больше недоступен.</red>"
  race-condition: "<red>Кто-то уже взял этот контракт прямо перед вами!</red>"
  abandoned: "<yellow>Вы отказались от контракта:</yellow> <gold>{CONTRACT}</gold>"
  not-accepted: "<red>У вас нет этого активного контракта.</red>"

rotation:
  announcement: "<green>✓ Появились новые ежедневные контракты! Используйте /contracts</green>"
  warning: "<yellow>⚠ Срок действия контрактов истекает через {TIME} мин.!</yellow>"

gui:
  title: "<gradient:#55FF55:#55FFFF>Доска контрактов</gradient>"
  too-many: "<yellow>Слишком много контрактов для отображения ({COUNT} скрыто)</yellow>"
  refresh: "<green>Доска обновлена</green>"

error:
  database: "<red>Ошибка базы данных. Обратитесь к администратору.</red>"
  invalid-contract: "<red>Некорректный контракт.</red>"
  contract-not-found: "<red>Контракт не найден.</red>"
  reward-failed: "<red>Не удалось выдать награды. Ошибка записана в лог.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  player-only: "<red>Команда только для игроков.</red>"
  player-not-found: "<red>Игрок не найден.</red>"

player-contract:
  created: "<green>Заказ создан:</green> <gold>{DESCRIPTION}</gold>"
  accepted: "<green>Заказ принят:</green> <gold>{DESCRIPTION}</gold>"
  completed: "<green>Заказ выполнен!</green> Награда: {GOLD} {CURRENCY}."
  cancelled: "<yellow>Заказ отменен.</yellow>"
  abandoned: "<yellow>Вы отказались от заказа. Он снова вернулся на доску.</yellow>"
  expired: "<yellow>Срок заказа истек.</yellow>"
  not-found: "<red>Заказ не найден.</red>"
  not-yours: "<red>Это не ваш заказ.</red>"
  race-condition: "<red>Кто-то принял этот заказ прямо перед вами!</red>"

admin:
  reloaded: "<green>Конфигурация перезагружена.</green>"
  rotated: "<green>Контракты обновлены вручную.</green>"
  completed-for: "<green>Контракт {CONTRACT} принудительно выполнен для {PLAYER}</green>"
  failed-for: "<green>Контракт {CONTRACT} принудительно провален для {PLAYER}</green>"
  reset: "<green>Ежедневная статистика сброшена для {PLAYER}</green>"
  diag-header: "<gold>=== Диагностика LoveContracts ===</gold>"
