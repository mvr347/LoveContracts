# ============================================
# LoveContracts Локализация и Тексты
# ============================================

gui:
  title: "<gradient:#55FF55:#55FFFF>Доска контрактов</gradient>"
  # 2026-10-07: кнопки фильтра/сортировки в стиле меню участников клана — в названии только
  # слово, а все варианты перечислены в описании (текущий отмечен ▶). Старые ключи filter-button/
  # sort-button с {FILTER}/{SORT} больше не используются, поэтому заведены новые ключи.
  filter-title: "<gold>Фильтр</gold>"
  sort-title: "<gold>Сортировка</gold>"
  cycle-hint: "<yellow>ЛКМ <gray>- дальше, <yellow>ПКМ <gray>- назад"
  prev-page: "<yellow>← Предыдущая страница</yellow>"
  next-page: "<yellow>Следующая страница →</yellow>"
  page-info: "<gray>Страница {PAGE} из {MAX_PAGES}</gray>"
  close-button: "<red>Закрыть</red>"
  close-lore: "<gray>Закрыть меню</gray>"

  current-contract: "<gradient:#FFFF55:#FFAA00><b>Текущий контракт</b></gradient>"
  inactive-create: "<gradient:#55FF55:#55FFFF><b>+ Создать контракт</b></gradient>"
  inactive-create-disabled: "<red><b>Временно отключено</b></red>"
  inactive-create-lore: "<gray>В ближайшее время</gray>"

  contract-status-completed: "<green>✔ ВЫПОЛНЕН</green>"
  contract-status-failed: "<red>✖ ПРОВАЛЕН</red>"
  contract-status-active-done-lmb: "<green><b>ЛКМ: Сдать контракт (Забрать награду)</b></green>"
  contract-status-active-done-rmb: "<red><b>ПКМ: Отменить контракт (Провал и штраф)</b></red>"
  contract-status-active-in-progress: "<yellow>✓ ВЗЯТЫЙ (В процессе)</yellow>"
  contract-status-locked: "<red>🔒 КОНТРАКТ ЗАБЛОКИРОВАН</red>"
  contract-status-locked-lore: "<red>У вас уже есть активный контракт!</red>"
  contract-status-req-unmet: "<red>✗ ТРЕБОВАНИЯ НЕ ВЫПОЛНЕНЫ</red>"
  contract-status-click-to-accept: "<yellow>Нажмите, чтобы принять</yellow>"

  confirm-title: "<gradient:#55FF55:#55FFFF>Подтверждение контракта</gradient>"
  confirm-yes: "<green>✓ Принять контракт</green>"
  confirm-yes-lore: "<gray>Нажмите, чтобы подтвердить принятие</gray>"
  confirm-no: "<red>✗ Отмена</red>"
  confirm-no-lore: "<gray>Нажмите, чтобы вернуться на доску</gray>"

  player-board-title: "<gradient:#55FF55:#55FFFF>Заказы игроков</gradient>"

filters:
  all: "Все"
  easy: "Легкие"
  medium: "Средние"
  hard: "Сложные"
  available: "Доступные"
  accepted: "Взятые"
  completed: "Выполненные"
  failed: "Проваленные"

sorts:
  all: "Все"
  reward-high: "От Б до М"
  reward-low: "От М до Б"
  difficulty: "Сложность"

difficulties:
  starter: "Новичок"
  easy: "Легкий"
  medium: "Средний"
  hard: "Сложный"

commands:
  no-permission: "<red>У вас нет прав для выполнения этой команды.</red>"
  help-header: "<dark_gray>========== <aqua>LoveContracts Помощь</aqua> ==========</dark_gray>"
  help-contracts: "<aqua>/contracts</aqua> <gray>- открыть доску контрактов</gray>"
  help-pcontract: "<aqua>/pcontract</aqua> <gray>- личные контракты между игроками</gray>"
  help-admin: "<aqua>/lovecontractsadmin</aqua> <gray>- административные команды</gray>"
  help-footer: "<dark_gray>=========================================</dark_gray>"
  admin-help-header: "<dark_gray>========== <aqua>LoveContracts Admin</aqua> ==========</dark_gray>"
  admin-help-reload: "<aqua>/lovecontractsadmin reload</aqua> <gray>- перезагрузить конфигурацию</gray>"
  admin-help-rotate: "<aqua>/lovecontractsadmin rotate</aqua> <gray>- ротация контрактов</gray>"
  admin-help-create: "<aqua>/lovecontractsadmin create</aqua> <gray>- создать контракт</gray>"
  admin-help-npc: "<aqua>/lovecontractsadmin npc</aqua> <gray>- управление NPC</gray>"
  admin-help-footer: "<dark_gray>=========================================</dark_gray>"

messages:
  contract-accepted: "<green>Вы приняли контракт:</green> <gold>{CONTRACT}</gold>"
  contract-completed: "<green>Выполнено:</green> <gold>{CONTRACT}</gold>"
  contract-failed: "<red>Провал:</red> <gold>{CONTRACT}</gold>"
  contract-already-taken: "<red>Вы уже выполняли этот контракт сегодня. Дождитесь следующей ротации.</red>"
  contract-no-slots: "<red>Свободные слоты на этот контракт закончились или его срок на доске истёк.</red>"
  contract-already-active: "<red>Вы уже выполняете контракт! Одновременно можно взять только один контракт.</red>"
  contract-not-met: "<red>Вы не соответствуете требованиям этого контракта!</red>"
  contract-not-found: "<red>Контракт не найден.</red>"
  contract-disabled: "<red>Для вас доступ к контрактам отключен администратором.</red>"
  contract-create-unavailable: "<red>Создание контрактов временно недоступно (\"В ближайшее время\").</red>"
  contract-not-completed-yet: "<yellow>Контракт еще не выполнен. Прогресс: {PROGRESS}</yellow>"

  fine-deducted: "<red>Списан штраф за провал контракта:</red> {AMOUNT}"
  fine-partial: "<yellow>Списано {PAID}. Остаток долга: {REMAINING}</yellow>"
  fine-collected: "<green>Списано {AMOUNT} в счет погашения долга по штрафу.</green>"
  fine-cleared: "<green>Поздравляем! Ваш долг по штрафам полностью погашен!</green>"

  broadcast-accept: "<yellow>{PLAYER}</yellow> принял(а) контракт <gold>{CONTRACT}</gold>"
  broadcast-complete: "<yellow>{PLAYER}</yellow> выполнил(а) контракт <gold>{CONTRACT}</gold>"
  broadcast-fail: "<yellow>{PLAYER}</yellow> провалил(а) контракт <gold>{CONTRACT}</gold>"
